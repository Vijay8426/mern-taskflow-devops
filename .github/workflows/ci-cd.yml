
name: TaskFlow CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # -------------------------
  # Frontend CI
  # -------------------------
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Application-code/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Application-code/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  # -------------------------
  # Backend CI
  # -------------------------
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Application-code/core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Application-code/core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend
        run: npm run build

  # -------------------------
  # Build and push Docker images
  # -------------------------
  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-latest

    needs:
      - frontend-ci
      - backend-ci

    # Publish only on a successful push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Application-code/core
          file: ./Application-code/core/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/taskflow-core:latest
            ${{ vars.DOCKERHUB_USERNAME }}/taskflow-core:${{ github.sha }}
          cache-from: type=gha,scope=taskflow-core
          cache-to: type=gha,mode=max,scope=taskflow-core

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Application-code/web
          file: ./Application-code/web/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/taskflow-web:latest
            ${{ vars.DOCKERHUB_USERNAME }}/taskflow-web:${{ github.sha }}
          cache-from: type=gha,scope=taskflow-web
          cache-to: type=gha,mode=max,scope=taskflow-web
